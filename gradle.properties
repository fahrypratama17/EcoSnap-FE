# --- EcoSnap backend URL (BuildConfig.API_BASE_URL) ---
# Value is a non-secret origin only: http(s)://host[:port]/ (no credentials, path, query or fragment).
# Resolution order: -PAPI_BASE_URL=... (CLI/CI), then API_BASE_URL in local.properties (untracked).
#   local.properties:  API_BASE_URL=http\://192.168.1.20\:8080/
#   CLI:               ./gradlew assembleDebug -PAPI_BASE_URL=http://192.168.1.20:8080/
# Debug default: http://10.0.2.2:8080/ (Android emulator -> host machine).
# Physical phone via USB: API_BASE_URL=http\://127.0.0.1\:8080/ and adb reverse tcp:8080 tcp:8080.
# Reapply adb reverse after reconnecting the phone. Go may keep listening on 127.0.0.1.
# Physical phone via LAN instead: use the laptop LAN IP, same Wi-Fi and Go HTTP_ADDR=0.0.0.0:8080.
# Debug allows cleartext only for configured Go/AI hosts; everything else is HTTPS-only.
# Release builds require an explicit HTTPS API_BASE_URL when a release variant is built.
# Never put secrets (API keys, service accounts, DB credentials) in these files.
#
# AI_SCAN_BASE_URL is a separate origin, not a Groq key and not the Go API.
# Set it via -PAI_SCAN_BASE_URL or local.properties; debug defaults to http://10.0.2.2:8000/.
# A physical phone needs a reachable LAN origin or localhost plus adb reverse tcp:8000 tcp:8000.
# Run the separate FastAPI service with its server-side provider credentials; Android Run does not start it.
# Release: blank disables AI; a configured origin must use HTTPS. No demo result substitutes for failures.

# --- Firebase ---
# Put the google-services.json of the Firebase project (Android app id com.example.ecosnap) at
# app/google-services.json, downloaded from Firebase Console > Project settings > Your apps.
# The file is git-ignored (per-developer project selection); the Google Services plugin requires it to build.

# --- Running from Android Studio ---
# Run starts Android only; keep the Go backend running separately from EcoSnap-BE (go run ./cmd/app).
# The BE process needs its own DATABASE_URL and Firebase Admin environment, never Android properties.
# Match app/google-services.json to the BE Firebase project and enable Email/Password authentication.
# Apply the BE migrations through 00012 using its runbook before using Home/favorites/support APIs.
# GET http://127.0.0.1:8080/health proves HTTP liveness only; authenticated Home and partner requests
# also exercise Firebase token verification and PostgreSQL. Empty lists can mean no visible seeded data.
# Emulator without reverse: 10.0.2.2. USB phone: 127.0.0.1 plus adb reverse. LAN phone: laptop IP and 0.0.0.0 listener.
# URL changes require rebuilding/running the APK; reopening an already installed APK keeps its old URL.
# Opening Android Studio does not deploy the Go API or make it reachable over the public internet.